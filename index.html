(async()=>{const m=document.getElementById("m");
const u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");s+="===".slice(0,(4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
