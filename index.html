<script>
(async()=>{const m=document.getElementById("m");
const u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");s+="===".slice(0,(4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
try{const k=new URLSearchParams(location.hash.slice(1)).get("k");if(!k){return;}
const d=JSON.parse(document.getElementById("d").textContent);
const key=await crypto.subtle.importKey("raw",u(k),{name:"AES-GCM"},false,["decrypt"]);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(d.iv),additionalData:new TextEncoder().encode(d.aad)},key,u(d.ct));
